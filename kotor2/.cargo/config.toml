# Cross-linking the 32-bit Windows patch modules from Linux needs MinGW-w64's
# i686 GCC driver on PATH (Fedora: `dnf install mingw32-gcc`; Debian/Ubuntu:
# `apt install gcc-mingw-w64-i686`) and the Rust target
# (`rustup target add i686-pc-windows-gnu`).
[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
ar = "i686-w64-mingw32-ar"

# Keep symbol tables and debug info out of release modules and tools (they
# triple the size of a patch DLL). Panics stay `unwind`: kpm-sdk's entry-point
# guards catch them so a failing hook returns a fallback instead of killing
# the game (see crates/kpm-sdk/README.md, "Panics").
[profile.release]
strip = true
